<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decrypt File - FileEncryptor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center">
  <div class="bg-gray-900 p-10 rounded-3xl w-full max-w-lg">
    <h1 class="text-3xl font-bold text-center mb-8">Decrypt File</h1>
    <p class="text-center text-gray-400 mb-8">Enter the encryption key shown on your dashboard</p>
    
    <form method="POST" class="space-y-6">
      <input type="text" name="key" placeholder="Paste encryption key here..." 
             class="w-full p-5 bg-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg font-mono" required>
      
      <button type="submit" 
              class="w-full bg-green-600 hover:bg-green-700 py-5 rounded-2xl font-semibold text-lg">
        Decrypt & Download
      </button>
    </form>
    
    <a href="/dashboard" class="block text-center mt-6 text-blue-400 hover:underline">
      ← Back to Dashboard
    </a>
  </div>
</body>
</html>
